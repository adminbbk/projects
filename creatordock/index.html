<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CreatorDock Demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{--bg:#0a0e24;--panel:#121837;--line:#232b55;--fg:#eef0ff;--muted:#9aa2cf;--accent:#8b5cf6;--accent2:#22d3ee;
--display:"Syne",system-ui,sans-serif;--body:"DM Sans",system-ui,sans-serif}
:root.light{--bg:#f5f6fc;--panel:#ffffff;--line:#dfe2f2;--fg:#12163a;--muted:#5b6290}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 var(--body);transition:background .3s,color .3s}
nav{position:sticky;top:0;z-index:5;display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px max(16px,4vw);background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{font-family:var(--display);font-weight:800;font-size:20px}.logo span{color:var(--accent)}
.tabs{display:flex;gap:4px}.tabs button,.icon{background:none;border:1px solid var(--line);color:var(--fg);font:500 14px var(--body);padding:7px 14px;border-radius:99px;cursor:pointer}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.right{display:flex;gap:8px;align-items:center}
.count{background:var(--accent2);color:#06202a;border-radius:99px;padding:0 7px;font-size:12px;font-weight:700;margin-left:4px}
.hero{padding:44px max(16px,4vw) 18px;max-width:1100px;margin:0 auto}
h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,5vw,54px);line-height:1.02;margin:0 0 12px}
h1 em{font-style:normal;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);max-width:60ch;margin:0}
.bar{max-width:1100px;margin:18px auto 0;padding:0 max(16px,4vw);display:flex;gap:10px;flex-wrap:wrap}
.bar input{flex:1;min-width:200px;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:inherit}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{background:var(--panel);border:1px solid var(--line);color:var(--muted);padding:7px 12px;border-radius:99px;font:inherit;font-size:13px;cursor:pointer}
.chips button.on{color:var(--fg);border-color:var(--accent)}
.grid{max-width:1100px;margin:18px auto 40px;padding:0 max(16px,4vw);display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:8px;transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-3px);border-color:var(--accent)}
.card .cat{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent2)}
.card h3{font-family:var(--display);margin:0;font-size:18px}.card p{margin:0;color:var(--muted);font-size:14px;flex:1}
.card .row{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.price{font-weight:700}
.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:8px 14px;font:600 13px var(--body);cursor:pointer}
.ghost{background:none;border:1px solid var(--line);color:var(--fg)}
.empty{grid-column:1/-1;color:var(--muted);text-align:center;padding:30px}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(360px,100%);background:var(--panel);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .3s;z-index:10;padding:20px;display:flex;flex-direction:column;gap:12px}
.drawer.open{transform:none}.drawer h2{font-family:var(--display);margin:0}
.line{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:8px 0;font-size:14px}
.line button{background:none;border:0;color:var(--muted);cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(5,8,25,.7);display:grid;place-items:center;z-index:20;padding:16px}
.modal[hidden]{display:none}.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;max-width:440px;width:100%}
.box textarea{width:100%;min-height:70px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;padding:10px}
.out{background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:10px;margin-top:10px;font-size:14px;white-space:pre-line}
footer{text-align:center;color:var(--muted);font-size:12px;padding:10px 16px 34px}footer a{color:var(--accent2)}
</style>
</head>
<body>
<nav>
  <div class="logo">Creator<span>Dock</span></div>
  <div class="tabs"><button class="on" data-v="tools">AI tools</button><button data-v="store">Store</button></div>
  <div class="right"><button class="icon" id="theme" aria-label="Toggle light and dark mode">◐</button><button class="icon" id="cartBtn">Cart<span class="count" id="count">0</span></button></div>
</nav>
<section class="hero"><h1>Everything a creator needs, <em>docked in one place.</em></h1><p class="sub" id="sub">AI tools that write hooks, captions and scripts, plus a store of ready-made templates and kits.</p></section>
<div class="bar"><input id="q" placeholder="Search tools and products" aria-label="Search"><div class="chips" id="chips"></div></div>
<div class="grid" id="grid"></div>
<aside class="drawer" id="drawer"><h2>Your cart</h2><div id="lines"></div><div class="line"><b>Total</b><b id="total">$0</b></div><button class="btn" id="checkout">Checkout</button><button class="btn ghost" id="close">Close</button><p id="msg" style="color:var(--muted);font-size:13px"></p></aside>
<div class="modal" id="modal" hidden><div class="box"><h2 id="mt" style="font-family:var(--display);margin:0 0 6px"></h2><p id="md" style="color:var(--muted);margin:0 0 10px"></p><textarea id="mi" aria-label="Your topic">morning routine for busy students</textarea><button class="btn" id="run" style="margin-top:10px">Generate</button> <button class="btn ghost" id="mclose">Close</button><div class="out" id="mo" hidden></div></div></div>
<footer>Demo build of CreatorDock: tool outputs are sample templates, and checkout is simulated. Built by Sameer Shah · <a href="https://github.com/adminbbk">GitHub</a></footer>
<script>
const tools=[
 {n:"Hook Writer",c:"Writing",d:"Five scroll-stopping opening lines for any reel topic.",f:t=>[`Nobody talks about this part of ${t}.`,`I tried ${t} for 30 days. Here's what changed.`,`Stop doing ${t} the hard way.`,`The 10-second version of ${t}.`,`If ${t} feels impossible, watch this.`].join('\n')},
 {n:"Caption Studio",c:"Writing",d:"A caption with a call to action and hashtags.",f:t=>`Small habits, big results. Here's my take on ${t} 👇\nSave this for later and tell me yours in the comments.\n#creator #${t.split(' ')[0]} #tips`},
 {n:"Reel Script",c:"Video",d:"A 30-second script split into hook, value and CTA.",f:t=>`HOOK (0–3s): Most people get ${t} wrong.\nVALUE (3–25s): Three steps that actually work…\nCTA (25–30s): Follow for part two.`},
 {n:"Thumbnail Brief",c:"Design",d:"Text, colours and layout notes for a YouTube thumbnail.",f:t=>`Text: "${t.toUpperCase().slice(0,22)}"\nLayout: face left, bold text right\nColours: high-contrast yellow on navy`},
 {n:"Content Calendar",c:"Planning",d:"A 7-day posting plan around one theme.",f:t=>['Mon: myth vs fact','Tue: tutorial','Wed: behind the scenes','Thu: carousel tips','Fri: Q&A','Sat: story poll','Sun: recap reel'].map(x=>x+` — ${t}`).join('\n')},
 {n:"Bio Polisher",c:"Writing",d:"Rewrite your profile bio in three styles.",f:t=>`Clear: Helping you with ${t}.\nPlayful: ${t}, minus the stress.\nAuthority: Daily ${t} tips, tested on myself.`}
];
const products=[
 {n:"Reel Template Pack",c:"Templates",d:"20 editable reel layouts for faceless content.",p:19},
 {n:"Carousel Kit",c:"Templates",d:"30 carousel slides with matching covers.",p:15},
 {n:"Brand Starter Kit",c:"Kits",d:"Logo grid, colour palette and font pairings.",p:29},
 {n:"Agency Proposal Deck",c:"Kits",d:"A pitch deck for social media agencies.",p:24},
 {n:"Story Sticker Set",c:"Templates",d:"60 animated story stickers.",p:9},
 {n:"Creator Media Kit",c:"Kits",d:"A one-page media kit for brand deals.",p:12}
];
let view='tools',cat='All',cart=[],q='';
const grid=document.getElementById('grid'),chips=document.getElementById('chips');
function cats(){return ['All',...new Set((view==='tools'?tools:products).map(x=>x.c))]}
function render(){chips.innerHTML=cats().map(c=>`<button class="${c===cat?'on':''}">${c}</button>`).join('');chips.querySelectorAll('button').forEach(b=>b.onclick=()=>{cat=b.textContent;render()});
 const list=(view==='tools'?tools:products).filter(x=>(cat==='All'||x.c===cat)&&(x.n+x.d).toLowerCase().includes(q));
 grid.innerHTML=list.length?list.map((x,i)=>`<div class="card"><span class="cat">${x.c}</span><h3>${x.n}</h3><p>${x.d}</p><div class="row">${view==='tools'?'<span class="price">Free</span><button class="btn" data-n="'+x.n+'">Try it</button>':'<span class="price">$'+x.p+'</span><button class="btn" data-n="'+x.n+'">Add to cart</button>'}</div></div>`).join(''):'<div class="empty">Nothing matches that search.</div>';
 grid.querySelectorAll('.btn').forEach(b=>b.onclick=()=>view==='tools'?openTool(b.dataset.n):add(b.dataset.n))}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');view=b.dataset.v;cat='All';render()});
document.getElementById('q').oninput=e=>{q=e.target.value.toLowerCase();render()};
document.getElementById('theme').onclick=()=>document.documentElement.classList.toggle('light');
const modal=document.getElementById('modal');let tool;
function openTool(n){tool=tools.find(t=>t.n===n);document.getElementById('mt').textContent=tool.n;document.getElementById('md').textContent=tool.d;document.getElementById('mo').hidden=true;modal.hidden=false}
document.getElementById('run').onclick=()=>{const o=document.getElementById('mo');o.textContent=tool.f(document.getElementById('mi').value.trim()||'your topic');o.hidden=false};
document.getElementById('mclose').onclick=()=>modal.hidden=true;
const drawer=document.getElementById('drawer');
function add(n){cart.push(products.find(p=>p.n===n));drawCart();drawer.classList.add('open')}
function drawCart(){document.getElementById('count').textContent=cart.length;document.getElementById('lines').innerHTML=cart.length?cart.map((p,i)=>`<div class="line"><span>${p.n}</span><span>$${p.p} <button data-i="${i}" aria-label="Remove">✕</button></span></div>`).join(''):'<p style="color:var(--muted)">Your cart is empty.</p>';
 document.querySelectorAll('#lines button').forEach(b=>b.onclick=()=>{cart.splice(+b.dataset.i,1);drawCart()});document.getElementById('total').textContent='$'+cart.reduce((s,p)=>s+p.p,0)}
document.getElementById('cartBtn').onclick=()=>drawer.classList.add('open');document.getElementById('close').onclick=()=>drawer.classList.remove('open');
document.getElementById('checkout').onclick=()=>{document.getElementById('msg').textContent=cart.length?'Demo checkout: no payment is taken.':'Add a product first.'};
render();drawCart();
</script>
</body>
</html>
